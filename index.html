        };

          document.execCommand('copy');
          setCopied(true);
          setTimeout(() => setCopied(false), 2500);

          console.error('Erreur lors de la copie', err);

                  </div>
                  <div className="flex items-center space-x-3 p-4 bg-spooky-900/60 rounded-2xl border border-spooky-800">
                    <span className="text-pumpkin-400 font-bold text-xl">✔</span>
                    <span>Corriger les groupes du nom (GN)</span>
                  </div>
                </div>

                <div className="pt-4">
                  <button
                    onClick={() => setIntroDismissed(true)}
                    className="w-full md:w-auto px-10 py-4 bg-pumpkin-500 hover:bg-pumpkin-600 text-white font-display font-bold text-xl rounded-2xl shadow-xl transition-all duration-200 transform hover:-translate-y-0.5"
                  >
                    🚀 Commencer l'activité !
                  </button>
                </div>

              </div>
            )}

            {}
            {activeTab === 0 && (
              <section className="space-y-8">
                <div className="bg-spooky-900 border border-spooky-800 rounded-3xl p-8 shadow-xl space-y-6">
                  
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-spooky-800 pb-4">
                    <div>
                      <h2 className="text-3xl font-display font-bold text-pumpkin-400">
                        🧙 Modélisation guidée pas-à-pas
                      </h2>
                      <p className="text-slate-300 text-base mt-1">
                        Choisis l'idée la plus riche et précise pour chaque partie du texte.
                      </p>
                    </div>
                    <span className="self-start sm:self-center px-4 py-2 bg-spooky-800 border border-spooky-700 rounded-xl text-sm font-bold text-spooky-200">
                      Étape {stepIdx + 1} sur {modelisationSteps.length}
                    </span>
                  </div>

                  {!modelisationComplete ? (
                    <div className="space-y-6">
                      
                      <div className="bg-spooky-800/80 rounded-2xl p-6 border border-spooky-700 space-y-2">
                        <h3 className="text-xl font-display font-bold text-pumpkin-300">
                          {modelisationSteps[stepIdx].title}
                        </h3>
                        <p className="text-slate-200 text-lg">
                          {modelisationSteps[stepIdx].instruction}
                        </p>
                      </div>

                      {/* CHOIX DES IDÉES */}
                      <div className="space-y-4">
                        {modelisationSteps[stepIdx].options.map((opt) => {
                          const isSelected = selectedOption === opt.id;
                          return (
                            <button
                              key={opt.id}
                              onClick={() => handleSelectOption(opt)}
                              className={`w-full text-left p-6 rounded-2xl border-2 transition-all duration-200 font-medium text-base leading-relaxed ${
                                isSelected
                                  ? opt.isBest
                                    ? 'bg-emerald-950/60 border-emerald-500 text-white shadow-lg shadow-emerald-900/30'
                                    : 'bg-rose-950/60 border-rose-500 text-white'
                                  : 'bg-spooky-800/40 border-spooky-700 hover:bg-spooky-800 hover:border-pumpkin-500 text-slate-200'
                              }`}
                            >
                              <div className="flex items-start space-x-3">
                                <span className="font-bold text-lg text-pumpkin-400">{opt.id.toUpperCase()}.</span>
                                <span className="flex-1">{opt.text}</span>
                              </div>
                            </button>
                          );
                        })}
                      </div>

                      {/* FEEDBACK RETROACTION */}
                      {stepFeedback && (
                        <div className={`p-6 rounded-2xl font-bold text-lg border ${
                          selectedOption && modelisationSteps[stepIdx].options.find(o => o.id === selectedOption)?.isBest
                            ? 'bg-emerald-900/40 border-emerald-500/60 text-emerald-300'
                            : 'bg-amber-900/40 border-amber-500/60 text-amber-200'
                        }`}>
                          {stepFeedback}
                        </div>
                      )}

                      {/* BOUTON SUIVANT */}
                      <div className="pt-4 flex justify-end">
                        <button
                          disabled={!selectedOption || !modelisationSteps[stepIdx].options.find(o => o.id === selectedOption)?.isBest}
                          onClick={handleNextStep}
                          className={`px-8 py-4 rounded-2xl font-display font-bold text-lg shadow-xl transition-all duration-200 ${
                            selectedOption && modelisationSteps[stepIdx].options.find(o => o.id === selectedOption)?.isBest
                              ? 'bg-pumpkin-500 hover:bg-pumpkin-600 text-white transform hover:-translate-y-0.5'
                              : 'bg-spooky-800 text-slate-500 cursor-not-allowed border border-spooky-700'
                          }`}
                        >
                          {stepIdx < modelisationSteps.length - 1 ? 'Partie suivante ➔' : 'Terminer la plan de texte 🏆'}
                        </button>
                      </div>

                    </div>
                  ) : (
                    /* RÉSULTAT FINAL REGROUPÉ */
                    <div className="space-y-6 pt-2">
                      <div className="p-6 bg-emerald-950/50 border border-emerald-500/50 rounded-2xl text-center space-y-2">
                        <span className="text-4xl">🎉</span>
                        <h3 className="text-2xl font-display font-bold text-emerald-300">
                          Plan de texte complété avec succès !
                        </h3>
                        <p className="text-slate-300">
                          Voici le plan complet rassemblant les meilleures idées sélectionnées pour notre monstre.
                        </p>
                      </div>

                      <div className="space-y-4">
                        {Object.entries(chosenIdeas).map(([stepId, text], idx) => (
                          <div key={stepId} className="p-6 bg-spooky-800/80 border border-pumpkin-500/30 rounded-2xl space-y-2">
                            <span className="text-sm font-bold text-pumpkin-400 font-display uppercase tracking-wider">
                              Paragraphe {idx + 1}
                            </span>
                            <p className="text-base text-slate-200 leading-relaxed font-medium">
                              {text}
                            </p>
                          </div>
                        ))}
                      </div>

                      <div className="pt-4 flex justify-center">
                        <button
                          onClick={resetModelisation}
                          className="px-8 py-3.5 bg-spooky-800 hover:bg-spooky-700 border border-spooky-600 text-white font-display font-bold text-base rounded-2xl transition-colors"
                        >
                          🔄 Recommencer l'activité de modélisation
                        </button>
                      </div>
                    </div>
                  )}

                </div>
              </section>
            )}

            {}
            {activeTab === 1 && (
              <section className="space-y-8">
                <div className="bg-spooky-900 border border-spooky-800 rounded-3xl p-8 shadow-xl space-y-6">
                  
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-spooky-800 pb-4">
                    <div>
                      <h2 className="text-3xl font-display font-bold text-pumpkin-400">
                        📖 Exemple de texte modèle (Cote A)
                      </h2>
                      <p className="text-slate-300 text-base mt-1">
                        Voici le texte descriptif idéal de 4e année. Lis attentivement ses 3 paragraphes.
                      </p>
                    </div>
                    <span className="px-4 py-2 bg-pumpkin-500/20 border border-pumpkin-500/40 text-pumpkin-300 rounded-xl font-display font-bold text-sm self-start sm:self-center">
                      ~{modelTextData.wordCount} mots
                    </span>
                  </div>

                  {/* TITRE DU TEXTE */}
                  <div className="text-center py-4 bg-spooky-800/50 rounded-2xl border border-spooky-700/60">
                    <h3 className="text-3xl font-display font-bold text-amber-300">
                      {modelTextData.title}
                    </h3>
                  </div>

                  {/* PARAGRAPHES DU TEXTE */}
                  <div className="space-y-6">
                    {modelTextData.paragraphs.map((p, idx) => (
                      <div key={p.id} className="p-6 bg-spooky-800/40 border border-spooky-700/80 rounded-2xl space-y-4 hover:border-spooky-600 transition-colors">
                        <div className="flex items-center justify-between">
                          <span className={`px-4 py-1.5 rounded-full text-xs font-bold font-display uppercase tracking-wider border ${p.accentColor}`}>
                            {p.section}
                          </span>
                          <span className="text-xs text-slate-400 font-semibold">Paragraphe {idx + 1}</span>
                        </div>

                        <p className="text-lg text-slate-100 leading-loose font-medium">
                          {p.text}
                        </p>

                        <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-spooky-800">
                          <span className="text-xs text-slate-400 font-bold">Mots clés riches :</span>
                          {p.keywords.map((kw, kwIdx) => (
                            <span key={kwIdx} className="px-3 py-1 bg-spooky-800 border border-spooky-700 text-pumpkin-300 font-semibold text-xs rounded-lg">
                              {kw}
                            </span>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>

                </div>
              </section>
            )}

            {}
            {activeTab === 2 && (
              <section className="space-y-8">
                
                {/* TABLEAU 1 : CRITÈRES DE RÉUSSITE */}
                <div className="bg-spooky-900 border border-spooky-800 rounded-3xl p-8 shadow-xl space-y-6">
                  <div className="border-b border-spooky-800 pb-4">
                    <h2 className="text-3xl font-display font-bold text-pumpkin-400">
                      📋 Critères de réussite du texte
                    </h2>
                    <p className="text-slate-300 text-base mt-1">
                      Ce que l'élève doit obligatoirement inclure dans chaque section de son texte descriptif.
                    </p>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="border-b border-spooky-700 bg-spooky-800/80 text-pumpkin-300 font-display text-base">
                          <th className="p-4 rounded-tl-2xl">Section du texte</th>
                          <th className="p-4 rounded-tr-2xl">Ce qu'on doit y retrouver</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-spooky-800 font-medium text-base text-slate-200">
                        {criteriaTableData.map((row, idx) => (
                          <tr key={idx} className="hover:bg-spooky-800/40 transition-colors">
                            <td className="p-4 font-bold text-pumpkin-400 font-display w-1/3">
                              {row.section}
                            </td>
                            <td className="p-4 leading-relaxed">
                              {row.content}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* TABLEAU 2 : OUTILS DE VÉRIFICATION TRANSVERSAUX */}
                <div className="bg-spooky-900 border border-spooky-800 rounded-3xl p-8 shadow-xl space-y-6">
                  <div className="border-b border-spooky-800 pb-4">
                    <h2 className="text-3xl font-display font-bold text-purple-400">
                      🛠️ Outils de vérification (Pour tout le texte)
                    </h2>
                    <p className="text-slate-300 text-base mt-1">
                      Ces stratégies de révision et de correction s'appliquent à l'ensemble du texte sans exception.
                    </p>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="border-b border-spooky-700 bg-spooky-800/80 text-purple-300 font-display text-base">
                          <th className="p-4 rounded-tl-2xl">Outil de vérification</th>
                          <th className="p-4 rounded-tr-2xl">Objectif de révision dans le texte</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-spooky-800 font-medium text-base text-slate-200">
                        {verificationToolsData.map((row, idx) => (
                          <tr key={idx} className="hover:bg-spooky-800/40 transition-colors">
                            <td className="p-4 font-bold text-purple-300 font-display w-1/3">
                              {row.tool}
                            </td>
                            <td className="p-4 leading-relaxed">
                              {row.target}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* SIMULATEUR PRATIQUE D'ACCORD */}
                <div className="bg-spooky-900 border border-pumpkin-500/40 rounded-3xl p-8 shadow-xl space-y-6">
                  <div className="space-y-2 border-b border-spooky-800 pb-4">
                    <span className="inline-block px-3.5 py-1 bg-pumpkin-500/20 text-pumpkin-400 font-display font-bold text-xs rounded-full">
                      ✏️ Pratique guidée d'accord
                    </span>
                    <h3 className="text-2xl font-display font-bold text-white">
                      Exercice : Accorder les adjectifs dans le Groupe du Nom (GN)
                    </h3>
                    <p className="text-slate-300 text-base">
                      Écris la bonne forme de l'adjectif entre parenthèses pour qu'il s'accorde avec le nom chef.
                    </p>
                  </div>

                  <div className="space-y-6 text-lg text-slate-100 leading-relaxed">
                    
                    <div className="p-5 bg-spooky-800/60 rounded-2xl border border-spooky-700 flex flex-col md:flex-row md:items-center gap-3">
                      <span>1. Sa peau est couverte de mousses (vert)</span>
                      <input
                        type="text"
                        placeholder="vertes"
                        value={accordPractice.q1}
                        onChange={(e) => setAccordPractice({ ...accordPractice, q1: e.target.value })}
                        className="px-4 py-2 bg-spooky-900 border border-spooky-600 rounded-xl text-white font-bold w-36 focus:outline-none focus:border-pumpkin-500"
                      />
                      <span>.</span>
                    </div>

                    <div className="p-5 bg-spooky-800/60 rounded-2xl border border-spooky-700 flex flex-col md:flex-row md:items-center gap-3">
                      <span>2. Il possède de longues cornes (pointu)</span>
                      <input
                        type="text"
                        placeholder="pointues"
                        value={accordPractice.q2}
                        onChange={(e) => setAccordPractice({ ...accordPractice, q2: e.target.value })}
                        className="px-4 py-2 bg-spooky-900 border border-spooky-600 rounded-xl text-white font-bold w-36 focus:outline-none focus:border-pumpkin-500"
                      />
                      <span>.</span>
                    </div>

                    <div className="p-5 bg-spooky-800/60 rounded-2xl border border-spooky-700 flex flex-col md:flex-row md:items-center gap-3">
                      <span>3. Il habite dans une forêt (mystérieux)</span>
                      <input
                        type="text"
                        placeholder="mystérieuse"
                        value={accordPractice.q3}
                        onChange={(e) => setAccordPractice({ ...accordPractice, q3: e.target.value })}
                        className="px-4 py-2 bg-spooky-900 border border-spooky-600 rounded-xl text-white font-bold w-36 focus:outline-none focus:border-pumpkin-500"
                      />
                      <span>.</span>
                    </div>

                  </div>

                  {accordFeedback && (
                    <div className={`p-5 rounded-2xl font-bold text-base border ${
                      accordFeedback.type === 'success'
                        ? 'bg-emerald-950/80 border-emerald-500/60 text-emerald-300'
                        : 'bg-rose-950/80 border-rose-500/60 text-rose-300'
                    }`}>
                      {accordFeedback.text}
                    </div>
                  )}

                  <div className="pt-2">
                    <button
                      onClick={checkAccords}
                      className="px-8 py-3.5 bg-pumpkin-500 hover:bg-pumpkin-600 text-white font-display font-bold text-base rounded-2xl shadow-lg transition-colors"
                    >
                      Vérifier mes accords
                    </button>
                  </div>

                </div>

              </section>
            )}

            {}
            {activeTab === 3 && (
              <section className="space-y-8">
                
                {/* En-tête de la boîte à mots avec cases pâles et texte noir */}
                <div className="bg-slate-100 border border-slate-300 rounded-3xl p-8 shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                  <div>
                    <h2 className="text-3xl font-display font-bold text-pumpkin-800">
                      🎃 Lexique pour la création d'un monstre
                    </h2>
                    <p className="text-slate-700 text-base mt-1 font-medium">
                      Clique sur les mots enrichis pour les ajouter à ton panier d'écriture.
                    </p>
                  </div>

                  {/* Search input */}
                  <div className="relative w-full md:w-72">
                    <input
                      type="text"
                      placeholder="Chercher un mot..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full pl-11 pr-4 py-3 bg-white border border-slate-300 rounded-2xl text-slate-900 font-semibold placeholder-slate-400 focus:outline-none focus:border-pumpkin-500 shadow-sm"
                    />
                    <span className="absolute left-4 top-3.5">
                      <IconSearch />
                    </span>
                  </div>
                </div>

                {/* PANIER DE MOTS SÉLECTIONNÉS AVEC CASES PÂLES ET MOTS EN NOIR */}
                {wordBasket.length > 0 && (
                  <div className="bg-amber-50 border-2 border-pumpkin-400 rounded-3xl p-6 shadow-xl space-y-4">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-amber-200 pb-3">
                      <h3 className="font-display font-bold text-pumpkin-800 text-xl flex items-center gap-2">
                        <span>🧺 Mon panier de rédaction ({wordBasket.length} {wordBasket.length > 1 ? 'mots' : 'mot'})</span>
                      </h3>
                      
                      <div className="flex items-center space-x-3">
                        <button
                          onClick={handleCopyWords}
                          className={`px-5 py-2.5 rounded-xl font-display font-bold text-sm flex items-center space-x-2 transition-all duration-200 ${
                            copied
                              ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/30'
                              : 'bg-pumpkin-600 hover:bg-pumpkin-700 text-white shadow-lg shadow-pumpkin-600/20 active:scale-95'
                          }`}
                        >
                          {copied ? <IconCheck /> : <IconCopy />}
                          <span>{copied ? 'Mots copiés !' : 'Copier mes mots'}</span>
                        </button>

                        <button
                          onClick={() => setWordBasket([])}
                          className="p-2.5 text-rose-600 hover:bg-rose-100 rounded-xl transition-colors flex items-center space-x-1 text-xs font-bold"
                          title="Vider le panier"
                        >
                          <IconTrash />
                          <span className="hidden md:inline">Vider</span>
                        </button>
                      </div>
                    </div>

                    <div className="flex flex-wrap gap-2 pt-1">
                      {wordBasket.map((w, idx) => (
                        <span
                          key={idx}
                          className="px-4 py-2 bg-white border-2 border-pumpkin-400 text-slate-900 font-bold text-base rounded-2xl flex items-center space-x-2 shadow-sm"
                        >
                          <span className="text-black">{w}</span>
                          <button
                            onClick={() => removeWord(w)}
                            className="text-rose-600 hover:text-rose-800 font-bold ml-2 text-lg leading-none"
                          >
                            ×
                          </button>
                        </span>
                      ))}
                    </div>
                  </div>
                )}

                {/* CATEGORIES DE MOTS - CASES PÂLES ET TEXTE EN NOIR */}
                <div className="space-y-8">
                  {lexiconCategories.map((cat) => (
                    <div key={cat.id} className="bg-slate-100 border border-slate-300 rounded-3xl p-8 shadow-xl space-y-6">
                      <h3 className="text-2xl font-display font-bold text-pumpkin-800 border-b border-slate-300 pb-4">
                        {cat.title}
                      </h3>

                      <div className="space-y-6">
                        {cat.sections.map((sec, secIdx) => (
                          <div key={secIdx} className="space-y-4">
                            <h4 className="font-display font-bold text-lg text-purple-900">
                              {sec.subtitle}
                            </h4>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                              {sec.items.map((item, itemIdx) => (
                                <div key={itemIdx} className="p-5 bg-white rounded-2xl border border-slate-300 space-y-3 shadow-sm">
                                  <span className="font-bold text-pumpkin-700 text-sm block">
                                    {item.label} :
                                  </span>
                                  <div className="flex flex-wrap gap-2">
                                    {item.words
                                      .filter(w => w.toLowerCase().includes(searchQuery.toLowerCase()))
                                      .map((w, wIdx) => (
                                        <button
                                          key={wIdx}
                                          onClick={() => addWord(w)}
                                          className="px-3.5 py-1.5 bg-slate-100 hover:bg-pumpkin-100 hover:border-pumpkin-500 text-slate-900 font-bold text-sm rounded-xl border border-slate-300 transition-all duration-150 shadow-xs"
                                        >
                                          + <span className="text-black">{w}</span>
                                        </button>
                                      ))}
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>

                    </div>
                  ))}
                </div>

              </section>
            )}

          </main>

          {}
          <footer className="mt-auto py-8 text-center text-sm text-spooky-200 border-t border-spooky-800/50">
            <p>Mon monstre d'Halloween • PFEQ 4e année • Enseignement du texte descriptif</p>
          </footer>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
